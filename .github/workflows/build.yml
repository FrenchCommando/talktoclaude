name: build

# Builds the Windows binaries (x64 and arm64), packages each as a portable
# zip and an Inno Setup installer, and on a v* tag attaches all four to a
# GitHub Release. talktoclaude is Windows-only by design (WASAPI, SMTC,
# SendInput); a port would add a job per platform here.

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = if ("${{ github.ref }}" -like "refs/tags/v*") { "${{ github.ref_name }}".Substring(1) } else { "0.0.0-" + "${{ github.sha }}".Substring(0, 7) }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch == 'arm64' && 'amd64_arm64' || 'x64' }}

      # GGML_NATIVE=OFF everywhere: ON (the default) compiles for the
      # runner's own CPU, and v0.2.0's x64 build died with an illegal
      # instruction (0xC000001D in ggml-cpu.dll) on an i7-8550U the moment
      # the model loaded. x64 targets the AVX2/FMA/F16C baseline, which is
      # every x86 CPU since 2013.
      #
      # Cross-compiling arm64 on an x64 runner: CMake takes the host as the
      # target processor unless told, and ggml then compiles its x86 kernels
      # for an ARM64 link (LNK2005/LNK2019 on ggml_gemv_*). Declare it. ggml
      # also refuses MSVC for ARM ("use clang"), so use the clang-cl that
      # ships with Visual Studio, targeting arm64. The icon .rc must go to
      # rc.exe, and Ninja's cmcldeps wrapper (which scans .rc includes with
      # the C compiler) breaks on clang-cl, so it is disabled for RC.
      - name: Configure
        run: >
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF
          ${{ matrix.arch == 'arm64' && '-DCMAKE_SYSTEM_NAME=Windows -DCMAKE_SYSTEM_PROCESSOR=ARM64 -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_RC_COMPILER=rc -DCMAKE_NINJA_CMCLDEPS_RC=OFF -DCMAKE_C_FLAGS=--target=arm64-pc-windows-msvc "-DCMAKE_CXX_FLAGS=--target=arm64-pc-windows-msvc /EHsc"' || '-DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON' }}

      - name: Build
        run: cmake --build build

      - name: Stage
        shell: pwsh
        run: |
          $stage = "stage\${{ matrix.arch }}"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item build\talktoclaude.exe, build\*.dll $stage
          Copy-Item README.md, LICENSE $stage
          Get-ChildItem $stage | Select-Object Name, Length
          if (-not (Test-Path "$stage\talktoclaude.exe")) { throw "no exe staged" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$stage\*" -DestinationPath "dist\talktoclaude-${{ steps.ver.outputs.version }}-windows-${{ matrix.arch }}.zip"

      - name: Smoke test (x64 only; the runner is x64)
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          # A windows-subsystem exe: --help prints to the parent console if
          # it can attach one and stays silent otherwise, never a message
          # box, so this cannot hang; check the exit code only. What it
          # proves is that the exe starts at all (DLL resolution, CRT).
          $p = Start-Process -FilePath stage\x64\talktoclaude.exe -ArgumentList --help -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "--help exited $($p.ExitCode)" }

      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DArch=${{ matrix.arch }} /DSrc=..\stage\${{ matrix.arch }} /DVersion=${{ steps.ver.outputs.version }} installer\talktoclaude.iss
          Get-ChildItem dist

      # Unsigned MSIX for Microsoft Store submission (the Store signs it).
      # Not attached to releases: an unsigned package can't be installed by
      # end users. Kept as a workflow artifact under dist/msix.
      - name: MSIX
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $v4 = if ($v -match '^\d+\.\d+\.\d+$') { "$v.0" } else { "0.0.0.0" }
          $st = "stage\msix-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force "$st\Assets" | Out-Null
          Copy-Item build\talktoclaude.exe, build\*.dll $st
          Copy-Item msix\Assets\* "$st\Assets"
          (Get-Content msix\AppxManifest.xml -Raw).Replace("__VERSION__", $v4).Replace("__ARCH__", "${{ matrix.arch }}") | Set-Content -Encoding utf8 "$st\AppxManifest.xml"
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName | Select-Object -Last 1
          New-Item -ItemType Directory -Force dist\msix | Out-Null
          & $makeappx.FullName pack /d $st /p "dist\msix\talktoclaude-$v-windows-${{ matrix.arch }}-unsigned.msix" /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed" }
          Get-ChildItem dist\msix

      - uses: actions/upload-artifact@v4
        with:
          name: talktoclaude-windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.exe
          generate_release_notes: true

  # Opens the winget-pkgs PR for a new version, from the FrenchCommando
  # fork, as a job here rather than an `on: release` workflow: the release
  # above is created with GITHUB_TOKEN, and events caused by that token
  # never trigger other workflows. Needs the WINGET_TOKEN secret, a classic
  # PAT with public_repo scope, owned by the fork's user. Only useful once
  # the package exists in winget-pkgs (first version merged by hand).
  winget:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # version defaults to the tag without its "v"; release-tag to the ref.
      - uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: FrenchCommando.talktoclaude
          installers-regex: '-setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
